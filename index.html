<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gemelon Studios</title>
<meta name="description" content="Gemelon Studios is an independent software studio building desktop apps, web tools and games.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Gemelon Studios">
<meta property="og:title" content="Gemelon Studios">
<meta property="og:description" content="Independent software studio building desktop apps, web tools and games.">
<meta property="og:url" content="https://repousiosjim.github.io/">
<meta property="og:image" content="https://repousiosjim.github.io/assets/beatforge.webp">
<meta name="twitter:card" content="summary_large_image">
<link rel="canonical" href="https://repousiosjim.github.io/">
<link rel="icon" href="assets/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="site">
  <nav class="wrap">
    <a class="brand" href="#top">Gemelon Studios</a>
    <a href="#work">Work</a>
    <a href="#open-source">Open source</a>
  </nav>
</header>

<main id="top">
  <section class="hero wrap">
    <h1>Independent software studio.</h1>
  </section>

  <section id="work" class="wrap" aria-roledescription="carousel" aria-labelledby="work-title">
    <h2 id="work-title" class="sr-only">Featured work</h2>
    <ul class="slides"></ul>
    <button class="arrow prev" aria-label="Previous">&#8592;</button>
    <button class="arrow next" aria-label="Next">&#8594;</button>
    <div class="controls">
      <div class="dots"></div>
      <button class="pause" aria-label="Pause slideshow" hidden></button>
    </div>
  </section>

  <section class="strip wrap">
    <div>
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="3" width="16" height="11" rx="1"/><path d="M7 17h6M10 14v3"/></svg>
      Desktop
    </div>
    <div>
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="10" cy="10" r="7.5"/><path d="M2.5 10h15M10 2.5c2.5 2 2.5 13 0 15M10 2.5c-2.5 2-2.5 13 0 15"/></svg>
      Web
    </div>
    <div>
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="6" width="16" height="9" rx="3"/><path d="M6 9v3M4.5 10.5h3"/><circle cx="14" cy="9.5" r="0.75" fill="currentColor"/><circle cx="16" cy="11.5" r="0.75" fill="currentColor"/></svg>
      Games
    </div>
  </section>

  <section id="open-source" class="wrap" aria-labelledby="open-source-title">
    <h2 id="open-source-title" class="sr-only">Open source</h2>
    <ul class="repos"></ul>
  </section>
</main>

<dialog class="viewer" aria-label="Screenshots">
  <figure>
    <img alt="">
    <figcaption><span class="viewer-count"></span> <span class="viewer-caption"></span></figcaption>
  </figure>
  <button class="viewer-nav prev" aria-label="Previous screenshot">&#8592;</button>
  <button class="viewer-nav next" aria-label="Next screenshot">&#8594;</button>
  <button class="viewer-close" aria-label="Close">&#215;</button>
</dialog>

<footer class="site">
  <div class="wrap">
    <span>Gemelon Studios, <span class="year">2026</span></span>
    <a href="https://github.com/RepousiosJim">GitHub</a>
  </div>
</footer>

<script src="script.js"></script>
</body>
</html>
