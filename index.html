<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gemelon Studios</title>
<link rel="icon" href="assets/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="site">
  <nav class="wrap">
    <a href="#work">Work</a>
    <a href="#open-source">Open source</a>
  </nav>
</header>

<main>
  <section class="hero wrap">
    <h1>Independent software studio.</h1>
  </section>

  <section id="work" class="wrap">
    <ul class="slides"></ul>
    <button class="arrow prev" aria-label="Previous">&#8592;</button>
    <button class="arrow next" aria-label="Next">&#8594;</button>
    <div class="dots"></div>
  </section>

  <section class="strip wrap">
    <div>
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="3" width="16" height="11" rx="1"/><path d="M7 17h6M10 14v3"/></svg>
      Desktop
    </div>
    <div>
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="10" cy="10" r="7.5"/><path d="M2.5 10h15M10 2.5c2.5 2 2.5 13 0 15M10 2.5c-2.5 2-2.5 13 0 15"/></svg>
      Web
    </div>
    <div>
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="6" width="16" height="9" rx="3"/><path d="M6 9v3M4.5 10.5h3"/><circle cx="14" cy="9.5" r="0.75" fill="currentColor"/><circle cx="16" cy="11.5" r="0.75" fill="currentColor"/></svg>
      Games
    </div>
  </section>

  <section id="open-source" class="wrap">
    <ul class="repos"></ul>
  </section>
</main>

<footer class="site">
  <div class="wrap">
    <span>Gemelon Studios, 2026</span>
    <a href="https://github.com/RepousiosJim">GitHub</a>
  </div>
</footer>

<script src="script.js"></script>
</body>
</html>
